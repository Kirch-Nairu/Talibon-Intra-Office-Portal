name: H1A Convergence V2 Builder

on:
  push:
    branches:
      - __tmp_h1b_refine_builder__

permissions:
  contents: write
  actions: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout builder carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, fileinfo, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run convergence builder
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: bash .h1a-convergence-v2.sh
