name: H1B Refinement Builder

on:
  push:
    branches:
      - __tmp_h1b_refine_builder__

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine and publish
        run: |
          cp .h1b-refine.py /tmp/h1b-refine.py
          python3 /tmp/h1b-refine.py
