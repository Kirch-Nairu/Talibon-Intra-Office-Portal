name: H0A Exact-SHA Hardening Dispatch

on:
  push:
    branches:
      - __tmp_h0a_runtime_builder__

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable baseline hardening on H0A final branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: KIRCH-TALIBON-H0A-RUNTIME-RECOVERY-V2
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/356437570/dispatches" \
            -d "{\"ref\":\"$TARGET_REF\"}"
