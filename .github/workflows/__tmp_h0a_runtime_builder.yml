name: H0A Runtime Recovery Builder

on:
  push:
    branches:
      - __tmp_h0a_runtime_builder__

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_h0a_builder
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talibon_h0a_builder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout builder source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact-base H0A worktree
        shell: bash
        env:
          BASE_SHA: 6a2cc1e0be9de64d34c6dc84c65308c455c7efcd
          BASE_LOG_BLOB: 479498a019ee5951f3ea5a70be02b9bcb7ad14b5
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git show "$SOURCE_SHA:.h0a-log-append" > /tmp/h0a-log-append
          git checkout --detach "$BASE_SHA"
          files=(
            app/Http/Middleware/AssignRequestId.php
            app/Services/ApplicationErrorResponse.php
            bootstrap/app.php
            resources/js/app.tsx
            resources/js/components/system/AppErrorBoundary.tsx
            resources/js/pages/Errors/Status.tsx
            tests/Feature/RuntimeRecoveryTest.php
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE_SHA:$path" > "$path"
          done
          test "$(git hash-object docs/ENGINEERING_LOG.md)" = "$BASE_LOG_BLOB"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, fileinfo, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare isolated environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=talibon_h0a_builder/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DEMO_PASSWORD"
          sed -i "s/^PROTOTYPE_DEMO_PASSWORD=.*/PROTOTYPE_DEMO_PASSWORD=$DEMO_PASSWORD/" .env

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force
          npm install --no-audit --no-fund

      - name: Verify H0A implementation
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Http/Middleware/AssignRequestId.php
          php -l app/Services/ApplicationErrorResponse.php
          php -l bootstrap/app.php
          php -l tests/Feature/RuntimeRecoveryTest.php
          composer validate --no-check-publish
          npm run types:check
          npm run build
          php artisan migrate:fresh --seed --force
          php artisan test tests/Feature/RuntimeRecoveryTest.php
          php artisan route:list >/tmp/h0a-route-list.txt

      - name: Append exact-base engineering log and prove diff
        shell: bash
        env:
          BASE_SHA: 6a2cc1e0be9de64d34c6dc84c65308c455c7efcd
          BASE_LOG_BLOB: 479498a019ee5951f3ea5a70be02b9bcb7ad14b5
        run: |
          set -euo pipefail
          git show "$BASE_SHA:docs/ENGINEERING_LOG.md" > /tmp/h0a-base-engineering-log.md
          test "$(git hash-object /tmp/h0a-base-engineering-log.md)" = "$BASE_LOG_BLOB"
          cp /tmp/h0a-base-engineering-log.md docs/ENGINEERING_LOG.md
          cat /tmp/h0a-log-append >> docs/ENGINEERING_LOG.md
          python3 -c "from pathlib import Path; b=Path('/tmp/h0a-base-engineering-log.md').read_bytes(); c=Path('docs/ENGINEERING_LOG.md').read_bytes(); assert c.startswith(b) and len(c)>len(b)"
          echo '--- ENGINEERING LOG DIFF ---'
          git diff "$BASE_SHA" -- docs/ENGINEERING_LOG.md
          read additions deletions path < <(git diff --numstat "$BASE_SHA" -- docs/ENGINEERING_LOG.md)
          test "$path" = "docs/ENGINEERING_LOG.md"
          test "$deletions" = "0"
          expected=(
            app/Http/Middleware/AssignRequestId.php
            app/Services/ApplicationErrorResponse.php
            bootstrap/app.php
            docs/ENGINEERING_LOG.md
            resources/js/app.tsx
            resources/js/components/system/AppErrorBoundary.tsx
            resources/js/pages/Errors/Status.tsx
            tests/Feature/RuntimeRecoveryTest.php
          )
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" | sort)
          test "${#actual[@]}" -eq 8
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git diff --check "$BASE_SHA"
          git diff --stat "$BASE_SHA"
          git status --short

      - name: Commit and publish H0A normally
        shell: bash
        env:
          BASE_SHA: 6a2cc1e0be9de64d34c6dc84c65308c455c7efcd
          TARGET_BRANCH: KIRCH-TALIBON-H0A-RUNTIME-RECOVERY-V2
        run: |
          set -euo pipefail
          git config user.name "H0A Runtime Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Http/Middleware/AssignRequestId.php \
            app/Services/ApplicationErrorResponse.php \
            bootstrap/app.php \
            resources/js/app.tsx \
            resources/js/components/system/AppErrorBoundary.tsx \
            resources/js/pages/Errors/Status.tsx \
            tests/Feature/RuntimeRecoveryTest.php \
            docs/ENGINEERING_LOG.md
          git commit -m "fix(runtime): add recoverable application error boundaries"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "FINAL_SHA=$(git rev-parse HEAD)"
