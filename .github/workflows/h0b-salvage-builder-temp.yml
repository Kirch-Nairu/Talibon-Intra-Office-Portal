name: H0B Salvage Builder Temp

on:
  push:
    branches:
      - KIRCH-TALIBON-H0B-SALVAGE-BUILDER-TEMP

permissions:
  contents: write

jobs:
  build-clean-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout salvage builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact-base H0B candidate
        shell: bash
        env:
          BASE_SHA: d1cb14f31228601cde9575db1c0a0c7cbd6eb4da
          RESULT_BRANCH: KIRCH-TALIBON-H0B-SALVAGE-BUILT2
          WORKFLOW_BLOB: d59d0021aad13a1a2294d59fd60bb67c0125d6f2
          BROWSER_BLOB: 91835c3c4a5c6f6398ae78a9786572af56548616
        run: |
          set -euo pipefail

          test "$(git hash-object .github/workflows/stable-baseline-hardening.yml)" = "$WORKFLOW_BLOB"
          test "$(git hash-object tests/Browser/h0-runtime-readiness.mjs)" = "$BROWSER_BLOB"

          cp .github/workflows/stable-baseline-hardening.yml /tmp/stable-baseline-hardening.yml
          cp tests/Browser/h0-runtime-readiness.mjs /tmp/h0-runtime-readiness.mjs
          cp .github/h0b-salvage-log-append.tmp /tmp/h0b-salvage-log-append.tmp

          git checkout --detach "$BASE_SHA"
          mkdir -p .github/workflows tests/Browser
          cp /tmp/stable-baseline-hardening.yml .github/workflows/stable-baseline-hardening.yml
          cp /tmp/h0-runtime-readiness.mjs tests/Browser/h0-runtime-readiness.mjs
          cat /tmp/h0b-salvage-log-append.tmp >> docs/ENGINEERING_LOG.md

          grep -Fq 'municipality-wide filtering' docs/ENGINEERING_LOG.md
          grep -Fq 'attachments/photos' docs/ENGINEERING_LOG.md
          grep -Fq 'approved raw municipal assets' docs/ENGINEERING_LOG.md

          git add -N .github/workflows/stable-baseline-hardening.yml tests/Browser/h0-runtime-readiness.mjs

          echo '=== MANDATORY ENGINEERING LOG DIFF ==='
          git diff "$BASE_SHA" -- docs/ENGINEERING_LOG.md
          if git diff --unified=0 "$BASE_SHA" -- docs/ENGINEERING_LOG.md | grep -E '^-[^-]'; then
            echo 'Historical engineering-log deletion/change detected.' >&2
            exit 1
          fi

          echo '=== MANDATORY DIFF STAT ==='
          git diff --stat "$BASE_SHA"
          echo '=== MANDATORY DIFF CHECK ==='
          git diff --check
          echo '=== MANDATORY STATUS ==='
          git status --short

          EXPECTED=$'.github/workflows/stable-baseline-hardening.yml\ndocs/ENGINEERING_LOG.md\ntests/Browser/h0-runtime-readiness.mjs'
          ACTUAL="$(git diff --name-only "$BASE_SHA" | sort)"
          test "$ACTUAL" = "$EXPECTED"

          node --check tests/Browser/h0-runtime-readiness.mjs
          test "$(git hash-object .github/workflows/stable-baseline-hardening.yml)" = "$WORKFLOW_BLOB"
          test "$(git hash-object tests/Browser/h0-runtime-readiness.mjs)" = "$BROWSER_BLOB"

          git add .github/workflows/stable-baseline-hardening.yml tests/Browser/h0-runtime-readiness.mjs docs/ENGINEERING_LOG.md
          git diff --cached --check

          TREE_SHA="$(git write-tree)"
          export GIT_AUTHOR_NAME='H0B QA Builder'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          CLEAN_SHA="$(printf '%s\n' 'test(hardening): establish stable baseline QA carrier' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")"

          test "$(git rev-parse "$CLEAN_SHA^")" = "$BASE_SHA"
          CLEAN_FILES="$(git diff-tree --no-commit-id --name-only -r "$CLEAN_SHA" | sort)"
          test "$CLEAN_FILES" = "$EXPECTED"

          echo "Clean candidate: $CLEAN_SHA"
          git push origin "$CLEAN_SHA:refs/heads/$RESULT_BRANCH"
          echo "### Clean H0B candidate: \`$CLEAN_SHA\`" >> "$GITHUB_STEP_SUMMARY"
