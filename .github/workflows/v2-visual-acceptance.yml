name: Talibon V2 Visual Acceptance
run-name: V2 visual evidence · ${{ inputs.target_ref || 'KIRCH-TALIBON-FRONTEND-DESIGN-V2' }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v2-visual-acceptance.yml
  workflow_dispatch:
    inputs:
      target_ref:
        description: V2 branch or exact V2-lineage commit to inspect
        required: true
        default: KIRCH-TALIBON-FRONTEND-DESIGN-V2
        type: string

permissions:
  contents: read

concurrency:
  group: talibon-v2-visual-${{ inputs.target_ref || 'KIRCH-TALIBON-FRONTEND-DESIGN-V2' }}
  cancel-in-progress: false

jobs:
  v2-visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talibon_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout QA carrier from default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve dedicated V2 harness outside target checkout
        shell: bash
        run: cp tests/Browser/v2-visual-acceptance.mjs "$RUNNER_TEMP/v2-visual-acceptance.mjs"

      - name: Resolve and restrict V2 target
        id: target
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref || 'KIRCH-TALIBON-FRONTEND-DESIGN-V2' }}
          V2_BRANCH: KIRCH-TALIBON-FRONTEND-DESIGN-V2
          V2_ACCEPTANCE_BASE_SHA: 74e628fc344ab1d0c15aed99bfa6da449372b205
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${V2_BRANCH}:refs/remotes/origin/${V2_BRANCH}"

          if [[ "$TARGET_REF" == "$V2_BRANCH" ]]; then
            TARGET_SHA="$(git rev-parse "origin/${V2_BRANCH}^{commit}")"
          elif [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            TARGET_SHA="$(printf '%s' "$TARGET_REF" | tr 'A-F' 'a-f')"
            git cat-file -e "${TARGET_SHA}^{commit}"
          else
            echo "Rejected target_ref. Only ${V2_BRANCH} or an exact 40-character commit SHA is allowed." >&2
            exit 1
          fi

          git merge-base --is-ancestor "$V2_ACCEPTANCE_BASE_SHA" "$TARGET_SHA" || {
            echo "Rejected target: it predates or is outside the accepted V2 visual baseline." >&2
            exit 1
          }
          git merge-base --is-ancestor "$TARGET_SHA" "origin/${V2_BRANCH}" || {
            echo "Rejected target: commit is not on the current V2 branch lineage." >&2
            exit 1
          }

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${TARGET_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Accepted V2 target: $TARGET_SHA"

      - name: Checkout exact V2 target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0
          clean: true

      - name: Restore isolated V2 harness
        shell: bash
        run: cp "$RUNNER_TEMP/v2-visual-acceptance.mjs" tests/Browser/v2-visual-acceptance.runtime.mjs

      - name: Verify exact target checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact target checkout: $ACTUAL_SHA"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, fileinfo, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare isolated QA environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=talibon_portal/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DEMO_PASSWORD"
          sed -i "s/^PROTOTYPE_DEMO_PASSWORD=.*/PROTOTYPE_DEMO_PASSWORD=$DEMO_PASSWORD/" .env
          echo "QA_DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "QA_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "QA_TARGET_REF=${{ inputs.target_ref || 'KIRCH-TALIBON-FRONTEND-DESIGN-V2' }}" >> "$GITHUB_ENV"
          echo "QA_TARGET_SHA=${{ steps.target.outputs.target_sha }}" >> "$GITHUB_ENV"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript
        run: npm run types:check

      - name: Production frontend build
        run: npm run build

      - name: PostgreSQL fresh migrate and synthetic seed
        run: php artisan migrate:fresh --seed --force

      - name: Install transient Playwright browser
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated Laravel runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/logs storage/app/qa/v2-visual
          nohup php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/v2-visual-server.log 2>&1 &
          echo $! > /tmp/talibon-v2-visual-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/v2-visual-server.log
          exit 1

      - name: V2 objective browser checks and visual evidence capture
        run: node tests/Browser/v2-visual-acceptance.runtime.mjs

      - name: Upload V2 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talibon-v2-visual-${{ steps.target.outputs.short_sha }}
          path: |
            storage/app/qa/v2-visual/**
            storage/logs/v2-visual-server.log
          if-no-files-found: warn
          retention-days: 14
