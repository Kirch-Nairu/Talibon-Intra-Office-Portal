name: Materialize Integration Foundation B Atomic Tree

on:
  push:
    branches:
      - KIRCH-PHASE1-INTEGRATION-B-MATERIALIZE
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: a189b5d3a5e27495efc4d7a6789aab5df384d682
      CANDIDATE_SHA: f7159962ee46df06615bd6233b9b52645322ad27
      FINAL_BRANCH: KIRCH-INTEGRATION-FOUNDATION-B-FINAL-TREE

    steps:
      - name: Checkout exact materialization branch
        uses: actions/checkout@v4
        with:
          ref: KIRCH-PHASE1-INTEGRATION-B-MATERIALIZE
          fetch-depth: 0

      - name: Materialize mandatory engineering log on exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          git checkout "$CANDIDATE_SHA" -- docs/ENGINEERING_LOG.md
          git checkout "$BASE_SHA" -- .github/workflows/ci.yml

          python3 <<'PY'
          from pathlib import Path

          path = Path('docs/ENGINEERING_LOG.md')
          text = path.read_text()
          marker = '\n## Current release state\n'
          if marker not in text:
              raise SystemExit('Engineering Log release-state marker not found')
          if '## 2026-08-23 — Integration Foundation B' in text:
              raise SystemExit('Foundation B log entry already exists')

          entry = r'''
## 2026-08-23 — Integration Foundation B

### `feat: establish integration idempotency and outbox boundary`
- Parent/base: `a189b5d3a5e27495efc4d7a6789aab5df384d682` (`feat: establish scoped integration client boundary`). Requirement: Contract Phase 1 **Integration Foundation B** only — idempotent execution for explicitly marked integration writes plus a transactional outbox boundary. No real Correspondence integration API is introduced by this milestone.
- Identity boundary: `IntegrationClient` / `IntegrationClientCredential` remain first-class machine identities separate from `User`; Foundation A authentication, active/valid credential checks, scope authorization, client rate limiting, correlation identity and audit identity remain the outer integration boundary. Human MFA/session authorization is unchanged.
- Idempotency marking: only routes explicitly carrying `integration.idempotency:<operation>` require `Idempotency-Key`; `GET /api/v1/integration/self` remains non-idempotency-keyed. Foundation B adds only the isolated proof write `POST /api/v1/integration/proof-writes` under authoritative scope `integration.proof.write` and operation `integration.proof.write`.
- Idempotency scope/persistence: `integration_idempotency_records` is uniquely scoped by `integration_client_id + integration_client_credential_id + operation + idempotency_key_hash`. The raw client key is not persisted; only `SHA-256(idempotency key)` is stored. The request fingerprint is SHA-256 over a canonicalized method/payload representation and intentionally excludes Authorization/bearer material.
- Concurrency strategy: a short committed database transaction uses the unique scope constraint plus row locking to create/observe the authoritative `processing` claim. The executing request owns a random processing token. Same scoped key + same fingerprint while processing returns stable `409 integration_idempotency_in_progress`; same scoped key + materially different fingerprint returns stable `409 integration_idempotency_conflict`. Correctness does not rely only on in-memory/cache locking.
- Completion/replay semantics: successful JSON responses persist a safe replay snapshot of status/body with the original correlation ID removed. The business mutation, outbox insert, idempotency completion snapshot and completion audit commit in the same authoritative database transaction. Same key + same fingerprint after completion returns the original logical result without re-running the application/domain action or creating a second outbox record. Replay injects the new HTTP request's correlation ID and marks the response `Idempotency-Replayed: true`; correlation identity is never reused across HTTP requests.
- Failure semantics: non-success/exceptional execution does not falsely persist a completed response. Authoritative action/outbox/completion work rolls back; the claim is then marked `failed` separately with no replay snapshot. A later same-key/same-fingerprint attempt may explicitly reclaim a failed record with a new processing token and incremented attempt count.
- Stable errors/audit: Foundation B adds `integration_idempotency_key_required`, `integration_idempotency_conflict`, and `integration_idempotency_in_progress`. Audit records distinguish original execution start/completion/failure, replay, conflict, rejected concurrent duplicate, and invalid/missing key. Idempotency records and audit summaries do not persist bearer tokens, credential plaintext secrets or Authorization headers.
- Transactional outbox: additive `outbox_messages` stores public event UUID, event type, aggregate type/reference, JSON payload, occurrence/availability times, pending/claimed status, claim owner/time, attempt count and last error. `TransactionalOutbox::record()` refuses to persist outside an active authoritative database transaction, keeping business mutation and outbox creation atomic.
- Dispatcher boundary: `OutboxDispatcher` provides internal claim/release semantics using PostgreSQL row locking with `FOR UPDATE SKIP LOCKED`. It does not perform third-party HTTP calls, external publication, queue delivery or transport. No Kafka, RabbitMQ, microservice split, webhook delivery or published-message claim is introduced.
- Proof surface/schema: additive `2026_08_23_150000_create_integration_idempotency_records_table.php`, `2026_08_23_150100_create_outbox_messages_table.php`, and `2026_08_23_150200_create_integration_proof_writes_table.php`. `integration_proof_writes` is an isolated non-production-domain proof surface used only to verify the idempotency/outbox contract without broadening Correspondence/Documents/Legislative/HR APIs.
- Focused verification actually observed on the disposable validation tree containing the exact Foundation B runtime/code/schema/test candidate plus temporary CI-only validation wiring: Composer install from the committed 109-package lock graph PASS; `composer validate --no-check-publish` PASS; PHP lint PASS for all changed/new PHP files; disposable PostgreSQL 16 `php artisan migrate:fresh --seed --force` PASS including all three additive Foundation B migrations; `IntegrationFoundationBTest` **15 passed / 86 assertions / 1.31s**; Foundation A compatibility `IntegrationFoundationTest` **17 passed / 129 assertions / 1.19s**; route inspection PASS with exactly `GET|HEAD /api/v1/integration/self` and `POST /api/v1/integration/proof-writes`. This database/run is disposable CI/test-environment evidence only and is not production or presentation-database evidence.
- Focused tests cover: same key/same payload executes once and replays the same logical result; materially different payload conflicts; persisted processing claim prevents duplicate execution; client, credential and operation scoping; failure cannot become a completed replay; bearer/key secrets are absent from idempotency storage; outbox creation is atomic with successful action; rollback removes both proof mutation and outbox row; replay creates no duplicate outbox row; correlation ID changes across original/replay requests; audit distinguishes execution/replay/conflict/concurrent rejection; dispatcher claim/release is database-locked and transport-free.
- Production LOC review: Foundation B changed/new production PHP totals **1,074 LOC**. Largest new service is `IntegrationIdempotencyService.php` at **173 LOC** and the idempotency middleware is **172 LOC**, both below repository caps; no source-size workaround is used.
- Scope exclusions/unchanged domains: no Correspondence API, Documents API, Legislative API, HR API, OAuth, JWT platform, webhook, Kafka/RabbitMQ, microservices, external HTTP publication, queue publication, or real transport. MFA production files, `EmployeeLifecycleService.php`, HRIS, Property, Legislative, and existing Workflow/Correspondence implementation are untouched.
- Unresolved risks/deferred hardening: a hard process death after a committed `processing` claim can leave that key conservatively in-progress; Foundation B intentionally does not auto-steal stale claims because doing so without a lease/heartbeat/reconciliation policy could permit double execution. Replay snapshots currently support explicitly idempotent JSON responses only. Outbox dispatch has claim/release mechanics but no scheduler, retry policy, external publisher, delivery acknowledgement, dead-letter handling or transport. Foundation A's distributed rate-limiter deployment still requires a shared authoritative cache backend.
- Release labels remain `PHASE1_CANDIDATE_OPEN_GATES` and `CONTRACT_PHASE_1_OPEN_GATES`.
- Next action: **review and accept Integration Foundation B**. Do not start the first real Correspondence integration API until this boundary is reviewed and explicitly approved.
'''

          text = text.replace(marker, '\n' + entry.strip() + '\n' + marker, 1)
          path.write_text(text)
          PY

      - name: Create one direct-parent production-history commit on staging ref
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          TREE_SHA=$(git write-tree)
          export GIT_AUTHOR_NAME='Kirch Ivan Balite'
          export GIT_AUTHOR_EMAIL='kirchbalite.careers@gmail.com'
          export GIT_COMMITTER_NAME='Kirch Ivan Balite'
          export GIT_COMMITTER_EMAIL='kirchbalite.careers@gmail.com'
          FINAL_SHA=$(printf '%s\n' 'feat: establish integration idempotency and outbox boundary' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")
          echo "FINAL_TREE_SHA=$TREE_SHA"
          echo "FINAL_SHA=$FINAL_SHA"
          git push origin "$FINAL_SHA":refs/heads/$FINAL_BRANCH
