name: Correspondence Core B Focused Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 72782c86653dd871cbd6c15fcb162eaff2789cbd
      RUNTIME_SHA: f877a6187294059cec50398cee6f0315a53e01ec
      FIXED_BRANCH: KIRCH-CORRESPONDENCE-CORE-B-RUNTIME-FIXED

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize corrected exact runtime tree
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$RUNTIME_SHA"
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/Feature/CorrespondenceCoreBTest.php')
          text = path.read_text()
          needle = "        [, , $token] = $this->credential([IntegrationScope::CorrespondenceReceive->value]);\n\n        $this->withToken($token)\n            ->postJson('/correspondence/'.$record->public_id.'/route', ["
          replacement = "        [, , $token] = $this->credential([IntegrationScope::CorrespondenceReceive->value]);\n        auth()->logout();\n\n        $this->withToken($token)\n            ->postJson('/correspondence/'.$record->public_id.'/route', ["
          if needle not in text:
              raise SystemExit('machine-client test patch anchor missing')
          text = text.replace(needle, replacement, 1)

          start_marker = '    public function test_within_existing_transaction_workflow_creation_boundary_rejects_standalone_use(): void\n'
          end_marker = '    public function test_human_read_surface_exposes_history_only_to_classification_authorized_context(): void\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('RefreshDatabase boundary-test patch anchors missing')
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
          test "$(git diff --name-only "$RUNTIME_SHA")" = "tests/Feature/CorrespondenceCoreBTest.php"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/DB_PASSWORD=$/DB_PASSWORD=postgres/' .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Lint Core B PHP diff
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            php -l "$file"
          done < <(git diff --name-only "$BASE_SHA" -- '*.php')

      - name: Migrate and seed disposable PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Run Correspondence Core B focused tests
        run: php artisan test tests/Feature/CorrespondenceCoreBTest.php

      - name: Run Correspondence Core A compatibility tests
        run: php artisan test tests/Feature/CorrespondenceCoreATest.php

      - name: Run Integration Foundation B compatibility tests
        run: php artisan test tests/Feature/IntegrationFoundationBTest.php

      - name: Run Integration Foundation A compatibility tests
        run: php artisan test tests/Feature/IntegrationFoundationTest.php

      - name: Inspect correspondence and API routes
        run: |
          php artisan route:list --path=correspondence
          php artisan route:list --path=api/v1

      - name: Guard excluded domains
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^app/.*/(Mfa|HRIS|Hris|Property|Legislative)|EmployeeLifecycleService\.php|^database/migrations/.*(hris|property|legislative|mfa))'; then
            echo 'Excluded-domain change detected.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E 'release|archive|document.*(upload|download|version|checksum)|retention|webhook|publisher' -i; then
            echo 'Excluded Correspondence Core B breadth detected.' >&2
            exit 1
          fi

      - name: Materialize corrected direct-parent runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          git add tests/Feature/CorrespondenceCoreBTest.php
          TREE_SHA=$(git write-tree)
          export GIT_AUTHOR_NAME='Kirch Ivan Balite'
          export GIT_AUTHOR_EMAIL='kirchbalite.careers@gmail.com'
          export GIT_COMMITTER_NAME='Kirch Ivan Balite'
          export GIT_COMMITTER_EMAIL='kirchbalite.careers@gmail.com'
          FIXED_SHA=$(printf '%s\n' 'chore: validate correspondence core B candidate v2' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")
          echo "FIXED_TREE_SHA=$TREE_SHA"
          echo "FIXED_SHA=$FIXED_SHA"
          git push origin "$FIXED_SHA":refs/heads/$FIXED_BRANCH
