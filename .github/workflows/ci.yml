name: Integration Foundation B Focused Validation

on:
  push:
    branches:
      - KIRCH-PHASE1-INTEGRATION-B-VALIDATE

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/DB_PASSWORD=$/DB_PASSWORD=postgres/' .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: PHP syntax validation
        run: |
          php -l app/Domain/Integration/IntegrationErrorCode.php
          php -l app/Domain/Integration/IntegrationScope.php
          php -l app/Domain/Integration/IntegrationOperation.php
          php -l app/Domain/Integration/IntegrationIdempotencyStatus.php
          php -l app/Domain/Integration/IntegrationIdempotencyDecisionType.php
          php -l app/Domain/Integration/IntegrationIdempotencyDecision.php
          php -l app/Domain/Integration/IntegrationIdempotencyExecutionRejected.php
          php -l app/Domain/Outbox/OutboxMessageStatus.php
          php -l app/Models/IntegrationIdempotencyRecord.php
          php -l app/Models/OutboxMessage.php
          php -l app/Models/IntegrationProofWrite.php
          php -l app/Services/IntegrationRequestFingerprint.php
          php -l app/Services/IntegrationIdempotencyService.php
          php -l app/Services/IntegrationIdempotencyResponse.php
          php -l app/Services/TransactionalOutbox.php
          php -l app/Services/OutboxDispatcher.php
          php -l app/Services/IntegrationProofWriteService.php
          php -l app/Http/Middleware/ExecuteIdempotentIntegrationRequest.php
          php -l app/Http/Requests/Api/V1/IntegrationProofWriteRequest.php
          php -l app/Http/Controllers/Api/V1/IntegrationProofWriteController.php
          php -l database/migrations/2026_08_23_150000_create_integration_idempotency_records_table.php
          php -l database/migrations/2026_08_23_150100_create_outbox_messages_table.php
          php -l database/migrations/2026_08_23_150200_create_integration_proof_writes_table.php
          php -l routes/api.php
          php -l bootstrap/app.php
          php -l tests/Feature/IntegrationFoundationBTest.php

      - name: Migrate and seed disposable PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Run Integration Foundation B focused tests
        run: php artisan test tests/Feature/IntegrationFoundationBTest.php

      - name: Run Integration Foundation A compatibility tests
        run: php artisan test tests/Feature/IntegrationFoundationTest.php

      - name: Verify integration routes
        run: php artisan route:list --path=api/v1/integration
