name: Materialize Correspondence Core A Atomic Tree

on:
  push:
    branches:
      - KIRCH-PHASE1-CORRESPONDENCE-A-MATERIALIZE
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 24838117fcd35b6d544b7996d804da7905e28cc8
      CANDIDATE_SHA: f6f1c989b4a4cf884b3affc4557eb8717e703400
      FINAL_BRANCH: KIRCH-CORRESPONDENCE-CORE-A-FINAL-TREE

    steps:
      - name: Checkout materialization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact validated runtime tree and append Engineering Log
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          git reset --hard "$CANDIDATE_SHA"

          python3 <<'PY'
          from pathlib import Path

          path = Path('docs/ENGINEERING_LOG.md')
          text = path.read_text()
          marker = '\n## Current release state\n'
          if marker not in text:
              raise SystemExit('Engineering Log release-state marker not found')
          if '## 2026-08-23 — Correspondence Core A' in text:
              raise SystemExit('Correspondence Core A entry already exists')

          entry = r'''
## 2026-08-23 — Correspondence Core A

### `feat: establish correspondence receive register classify core`
- Parent/base: `24838117fcd35b6d544b7996d804da7905e28cc8` (`feat: establish integration idempotency and outbox boundary`). Requirement: first real Contract Phase 1 Correspondence slice, limited to authoritative **RECEIVE -> REGISTER -> CLASSIFY** plus the bridge for later human ROUTE work. This entry does not claim the full Correspondence lifecycle closed.
- Runtime candidate/evidence identity: `f6f1c989b4a4cf884b3affc4557eb8717e703400` is the direct-parent Correspondence Core A runtime/code/schema/test candidate. Focused verification ran on a disposable PR validation tree containing byte-identical candidate runtime/test/schema blobs plus temporary CI-only validation wiring. The final production commit is reconstructed from the exact candidate tree with only this `docs/ENGINEERING_LOG.md` entry added; the runtime evidence below therefore applies to the candidate runtime blobs and is not claimed as an exact-SHA runtime run of the documentation-bearing production commit.
- Aggregate/schema: additive `correspondence_records` owns correspondence-specific identity and lifecycle data instead of overloading generic `transactions`. It stores public UUID, safe external reference, source/channel, sender/contact metadata, subject/summary, receive source identity, nullable receiving integration client and credential, nullable receiving department, nullable human registration/classification actors and timestamps, municipal reference, classification, lifecycle state, originating external reference, and nullable unique `workflow_transaction_id` referencing existing `transactions`. Machine and human actor columns remain distinct.
- Append-only history: additive `correspondence_events` records event, previous/new lifecycle state, nullable human actor, nullable integration-client actor, office, remarks/metadata, request correlation UUID and occurrence time. Normal Eloquent update/delete attempts are rejected; lifecycle services append new events inside the authoritative database transaction.
- Lifecycle vocabulary: typed `CorrespondenceLifecycleState` implements `received`, `registered`, and `classified`. `routed`, `in_action`, `released`, and `archived` are reserved vocabulary only; their transitions are not implemented in Core A. Return/escalation remains future work.
- Classification/authorization: typed `CorrespondenceClassification` centralizes `public`, `internal`, `confidential`, and `restricted`. `CorrespondenceAccessDecider` combines active human municipal identity, role, receiving/current workflow office, future assignment context, and classification. Restricted/confidential access is deliberately conservative; `system_admin` is not treated as automatic content authority. Explicit per-record grants/delegations are not yet modeled.
- Machine-vs-human actor model: integration RECEIVE persists `receiving_integration_client_id`, `receiving_integration_client_credential_id`, credential public identity and a machine-authored `received` event while leaving human registration/classification actor columns null. No fake `User` or employee is created. Human REGISTER/CLASSIFY remain under the existing `auth -> active -> mfa.assured` web boundary. Machine clients never pass through `TransactionWorkflowService::create()`.
- Integration RECEIVE: `POST /api/v1/correspondence`, authoritative scope `correspondence.receive`, operation `correspondence.receive`. Request chain remains `correlation -> integration.auth -> integration.scope:correspondence.receive -> integration.rate -> integration.idempotency:correspondence.receive -> validation/application action -> integration.audit`. Successful execution creates exactly one correspondence record, one `received` history event and one `correspondence.received` outbox row in the authoritative transaction, and returns public ID/reference, `received` state and current correlation identity.
- Integration STATUS: `GET /api/v1/correspondence/{publicId}`, scope `correspondence.status.read`. Status visibility is ownership-scoped to the submitting/receiving `IntegrationClient`; possession of the scope is not global municipal correspondence visibility. The response exposes only public ID/reference, lifecycle state, receive/register timestamps and classification only when externally safe. Restricted/confidential classification details, internal remarks, internal human IDs, documents and audit data are not returned. Non-owned records use a stable non-disclosing `correspondence_not_found` response.
- Foundation B integration: RECEIVE uses the existing persisted idempotency boundary. Same client/credential/operation/key + same fingerprint replays the original logical result with a fresh HTTP correlation ID and does not create another correspondence/event/outbox row. Same key + materially different payload returns the existing stable idempotency conflict. Foundation B proof-write endpoint remains present and unchanged.
- Human REGISTER: the service row-locks the correspondence record, requires `received`, authorizes a real human actor, assigns the receiving department from that actor's active employee identity, records `registered_by_user_id`/`registered_at`, allocates a unique municipal reference, appends `registered`, and records `correspondence.registered` outbox/audit state atomically. Re-registration is state-rejected rather than silently allocating a second reference.
- Reference strategy: additive `correspondence_reference_counters` uses one row per year, `insertOrIgnore`, `SELECT ... FOR UPDATE`, increment and a database-unique `municipal_reference_no`; format is `TAL-COR-YYYY-000001`. It does not use unprotected `MAX(id)+1`. Machine receive references are UUID-derived `TAL-EXT-YYYY-<token>` identifiers and are separate from municipal registration numbers.
- Human CLASSIFY: requires current state `registered`, an explicit enum classification and authorized human office/role context. It row-locks the record, records classifier/timestamp/classification, appends `classified`, and writes `correspondence.classified` outbox/audit state atomically. API clients cannot classify.
- Workflow bridge: `workflow_transaction_id` remains nullable through Core A. Classification prepares correspondence for a later authorized human ROUTE action, which may create/link the existing generic `WorkflowTransaction` using a real human actor. Core A does not duplicate or weaken the workflow engine and does not write an integration client into `created_by_user_id`.
- Transactional outbox: RECEIVE, REGISTER and CLASSIFY record `correspondence.received`, `correspondence.registered`, and `correspondence.classified` through Foundation B `TransactionalOutbox` inside the same business transaction. No external publisher, webhook, transport, scheduler, Kafka, RabbitMQ or queue-delivery claim is introduced.
- Verification actually observed: Composer install from the committed **109-package** lock graph PASS; `composer validate --no-check-publish` PASS; PHP lint PASS for every changed/new PHP file; disposable PostgreSQL 16 `php artisan migrate:fresh --seed --force` PASS including all three Core A additive migrations; `CorrespondenceCoreATest` **17 passed / 100 assertions / 1.81s**; Foundation B compatibility `IntegrationFoundationBTest` **15 passed / 86 assertions / 1.51s**; Foundation A compatibility `IntegrationFoundationTest` **17 passed / 129 assertions / 1.19s**; route inspection PASS with exactly four `/api/v1` routes (existing self/proof plus correspondence receive/status) and four correspondence routes total (two API + human register/classify); scope/excluded-domain static inspection PASS. This is disposable CI/test-environment evidence, not production database evidence.
- Focused correspondence coverage includes receive/status scopes and client ownership, idempotent single execution/replay/conflict, no duplicate outbox, append-only history, human-only registration, state guards, unique locked annual reference allocation, classification ordering/authorization, classification-sensitive access including non-global `system_admin`, safe external status, machine/human actor separation, transaction rollback, audit/event correlation identity, and deferred workflow linkage.
- Production size review: validation measured **1,273 LOC** across the complete changed/new production PHP files (tests excluded; whole-file measurement includes modified enum/route files). The base-to-candidate diff adds **1,036 production PHP lines** excluding the focused test. Largest new service is `CorrespondenceLifecycleService.php` at **158 LOC** and largest authorization service is `CorrespondenceAccessDecider.php` at **113 LOC**, below repository service caps.
- Explicit exclusions/unchanged domains: no attachment upload/download, document versions/checksums, retention rules, full ROUTE UI/action, ACT expansion, RELEASE, ARCHIVE, correspondence webhook/publication, outbox publisher, stale-idempotency lease stealing, Legislative API, HR API or public citizen portal. MFA production files, `EmployeeLifecycleService.php`, HRIS, Property, Legislative, and existing Workflow/Correspondence transaction behavior are untouched. Integration Foundations A/B remain structurally intact; only their authoritative scope/operation/error registries and API route table are extended for the approved correspondence boundary.
- Remaining gaps/risks: receiving office is intentionally assigned only when a real human registers machine-received correspondence; explicit correspondence grants/delegations and a dedicated human correspondence read/list UI are not yet modeled; protected documents and retention are absent; `workflow_transaction_id` remains null until later human ROUTE; Foundation B stale `processing` claim recovery remains deferred; outbox remains transport-free. Core A must not be represented as full Correspondence completion.
- Release labels remain `PHASE1_CANDIDATE_OPEN_GATES` and `CONTRACT_PHASE_1_OPEN_GATES`.
- Next action: **Correspondence Core B — ROUTE / ACT / RELEASE / ARCHIVE plus protected documents sequencing**. Do not begin that slice until Core A is reviewed.
'''

          text = text.replace(marker, '\n' + entry.strip() + '\n' + marker, 1)
          path.write_text(text)
          PY

      - name: Create one direct-parent production-history commit
        shell: bash
        run: |
          set -euo pipefail
          git add docs/ENGINEERING_LOG.md
          TREE_SHA=$(git write-tree)
          export GIT_AUTHOR_NAME='Kirch Ivan Balite'
          export GIT_AUTHOR_EMAIL='kirchbalite.careers@gmail.com'
          export GIT_COMMITTER_NAME='Kirch Ivan Balite'
          export GIT_COMMITTER_EMAIL='kirchbalite.careers@gmail.com'
          FINAL_SHA=$(printf '%s\n' 'feat: establish correspondence receive register classify core' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")
          echo "FINAL_TREE_SHA=$TREE_SHA"
          echo "FINAL_SHA=$FINAL_SHA"
          git push origin "$FINAL_SHA":refs/heads/$FINAL_BRANCH
