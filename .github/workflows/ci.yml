name: Integration Foundation A Validation

on:
  pull_request:

jobs:
  focused-integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      BASE_SHA: 47f1ceb479b3839ce7d22d24d3e93585f7231c46
      CANDIDATE_SHA: 4b098990398182054b04be93f7799b3543bf7865

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          composer validate --no-check-publish

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | grep '\.php$' > /tmp/php-files.txt
          while IFS= read -r file; do php -l "$file"; done < /tmp/php-files.txt

      - name: Disposable PostgreSQL migration and seed
        run: php artisan migrate:fresh --seed --force

      - name: Focused Integration Foundation A tests
        run: php artisan test tests/Feature/IntegrationFoundationTest.php

      - name: API route and operational command inspection
        shell: bash
        run: |
          set -euo pipefail
          php artisan route:list --path=api/v1
          php artisan list --raw | grep '^integration:'

      - name: Scope registry and production LOC inspection
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -R --include='*.php' -n 'integration\.self\.read' app bootstrap routes database | wc -l)" -eq 1
          git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" \
            | grep '\.php$' \
            | grep -v '^tests/' \
            | xargs wc -l

      - name: Excluded-domain static guard
        run: |
          git diff --exit-code "$BASE_SHA" "$CANDIDATE_SHA" -- \
            app/Domain/Identity \
            app/Services/AuthenticationAssurance.php \
            app/Services/MfaService.php \
            app/Services/SensitiveInertiaResponse.php \
            app/Services/EmployeeLifecycleService.php \
            config/identity.php \
            app/Domain/Workflow \
            app/Policies/TransactionPolicy.php \
            app/Services/TransactionWorkflowService.php
