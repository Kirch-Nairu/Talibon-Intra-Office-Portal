name: Correspondence Core B Focused Validation

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 72782c86653dd871cbd6c15fcb162eaff2789cbd
      RUNTIME_SHA: f877a6187294059cec50398cee6f0315a53e01ec

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/DB_PASSWORD=$/DB_PASSWORD=postgres/' .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Lint exact Core B PHP diff
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            php -l "$file"
          done < <(git diff --name-only "$BASE_SHA" "$RUNTIME_SHA" -- '*.php')

      - name: Migrate and seed disposable PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Run Correspondence Core B focused tests
        run: php artisan test tests/Feature/CorrespondenceCoreBTest.php

      - name: Run Correspondence Core A compatibility tests
        run: php artisan test tests/Feature/CorrespondenceCoreATest.php

      - name: Run Integration Foundation B compatibility tests
        run: php artisan test tests/Feature/IntegrationFoundationBTest.php

      - name: Run Integration Foundation A compatibility tests
        run: php artisan test tests/Feature/IntegrationFoundationTest.php

      - name: Inspect correspondence and API routes
        run: |
          php artisan route:list --path=correspondence
          php artisan route:list --path=api/v1

      - name: Guard excluded domains
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$RUNTIME_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^app/.*/(Mfa|HRIS|Hris|Property|Legislative)|EmployeeLifecycleService\.php|^database/migrations/.*(hris|property|legislative|mfa))'; then
            echo 'Excluded-domain change detected.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E 'release|archive|document.*(upload|download|version|checksum)|retention|webhook|publisher' -i; then
            echo 'Excluded Correspondence Core B breadth detected.' >&2
            exit 1
          fi
